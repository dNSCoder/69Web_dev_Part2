{% extends "base.html" %}
{% block content %}
    <h1 class="text-2xl font-semibold mb-2">หน้าแรก</h1>
    {% if user.is_authenticated %}
        <p class="text-lg text-gray-700 mb-4">ยินดีต้อนรับ กลับมา</p>
        <span class="me-3"> สะวักลีคุณ {{user.first_name}} </span>
        <a href="{% url 'profile_edit' %}" class="btn btn-outline-primary"> แก้ไขโปรไฟล์ของฉัน </a>     
    {% else %}
        <h1 class="text-lg text-gray-700 mb-4">ยินดีต้อนรับ</h1>  
    {% endif %}
{% endblock %}
