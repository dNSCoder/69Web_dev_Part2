<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part2: Webdev 2569</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand navbar-light bg-light border-bottom mb-4">
        <div class="container">
            <span class="navbar-brand">My Webdev Project69</span>
            <div>
            {% if user.is_authenticated %}
                <span class="me-3"> สะวักลี ทุกคง {{user.username}} </span>
                <form method="post" class="d-inline" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-danger btn-sm me-2"> logout </button>
                </form>
                
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm me-2"> login </a>
                <a href="{% url 'register' %}" class="btn btn-primary btn-sm me-2"> register</a>
            {% endif %}
            </div>
        </div>
    </nav>
    <main class="container">
        <!-- ส่วนแสดงผลของหน้าเว็บแต่ละหน้า -->
        {% block content %}
        {% endblock %}
    </main>
    
</body>
</html>
