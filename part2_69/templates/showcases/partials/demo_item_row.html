<li id="item-{{ item.id }}" class="flex items-center justify-between px-4 py-2">
  <span class="text-sm text-gray-700">{{ item.title }}</span>
  <button hx-delete="{% url 'demo_item_delete' item.id %}"
          hx-target="#item-{{ item.id }}"
          hx-swap="outerHTML swap:1s"
          hx-confirm="ลบ '{{ item.title }}' ใช่ไหม?"
          class="text-red-600 text-sm hover:underline">
    ลบ
  </button>
</li>
