{% extends "base.html" %}
{% block content %}
<div class="space-y-6 py-6">
  <div class="border-b border-gray-200 pb-4">
    <h1 class="text-2xl font-bold">HTMX Demo</h1>
    <p class="text-gray-500 text-sm mt-1">Create / Read / Delete บนข้อมูลสาธิต ไม่ต้อง login</p>
  </div>

  <form hx-post="{% url 'demo_item_add' %}"
        hx-target="#demo-search-list"
        hx-swap="outerHTML"
        hx-on::after-request="this.reset()"
        class="flex gap-2">
    <input type="text" name="title" placeholder="ชื่อรายการ..." required
           class="flex-1 rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    <button type="submit" class="btn-wanarase">เพิ่ม</button>
  </form>

  <div class="relative">
    <input type="text" name="q" placeholder="พิมพ์ค้นหา..."
           hx-get="{% url 'demo_search' %}"
           hx-trigger="keyup changed delay:300ms"
           hx-target="#demo-search-list"
           hx-swap="innerHTML"
           hx-indicator="#search-spinner"
           class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    <span id="search-spinner" class="htmx-indicator absolute right-3 top-2.5 text-xs text-gray-400">กำลังค้นหา...</span>
  </div>

  <div class="bg-white rounded-lg border border-gray-200">
    {% include "showcases/partials/demo_item_list.html" %}
  </div>
</div>
{% endblock %}
